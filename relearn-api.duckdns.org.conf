server {
    listen 80;
    listen [::]:80;
    server_name relearn-api.duckdns.org 43.128.101.32;

    client_max_body_size 100M;
    charset utf-8;

    access_log /var/log/nginx/relearn_access.log;
    error_log /var/log/nginx/relearn_error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # =========================================================================
    # 1. FRONTEND: React SPA Static Build
    # =========================================================================
    root /var/www/relearn-frontend;
    index index.html;

    # Tangani routing React Router (mencegah error 404 saat reload/refresh)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aset statis build React
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # =========================================================================
    # 2. BACKEND: Laravel API Routing
    # =========================================================================
    location ^~ /api {
        root /var/www/relearn-mvp/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME /var/www/relearn-mvp/backend/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_read_timeout 300;
        }
    }

    # Eksekusi PHP index.php untuk request Laravel
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/relearn-mvp/backend/public/index.php;
        fastcgi_read_timeout 300;
    }

    # Blokir akses ke file sensitif (.env, .git, dll)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

